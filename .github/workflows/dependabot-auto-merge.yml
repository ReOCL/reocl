name: dependabot auto-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: |
          PR_URL="${{ github.event.workflow_run.pull_requests[0].url }}"
          [ -n "$PR_URL" ] || { echo "no pull request on this run"; exit 0; }
          AUTHOR=$(gh api "$PR_URL" --jq .user.login) || exit 1
          [ "$AUTHOR" = "dependabot[bot]" ] || { echo "not dependabot: $AUTHOR"; exit 0; }
          COMMITS=$(gh api "$PR_URL/commits" --jq '.[].commit.message') || exit 1
          case "$COMMITS" in
            *"update-type: version-update:semver-major"*)
              echo "major update; leaving for manual review"; exit 0 ;;
          esac
          gh pr merge --squash "$(gh api "$PR_URL" --jq .html_url)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
